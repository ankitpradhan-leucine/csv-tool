name: Run CSV Tests

on:
  workflow_dispatch:
    inputs:
      application_url:
        description: 'Application URL to test'
        required: true
        type: string

      workbook:
        description: 'Test workbook file'
        required: true
        type: choice
        options:
          - scenarios/sample-test.xlsx

      timezone:
        description: 'Timezone for system clock (e.g., UTC, America/New_York, Asia/Kolkata)'
        required: false
        default: 'UTC'
        type: string

      use_local_llm:
        description: 'Use local LLM (Ollama) with Claude fallback (hybrid mode)'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-csv-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install chromium
          playwright install-deps chromium

          # Install window manager and desktop panel for CSV compliance screenshots
          sudo apt-get update
          sudo apt-get install -y fluxbox x11-utils xfonts-base tint2

      - name: Install Ollama and Local LLM
        if: ${{ inputs.use_local_llm }}
        run: |
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh

          # Start Ollama service in background
          ollama serve &
          sleep 5

          # Pull a lightweight vision model for CI (minicpm-v:8b is ~4.7GB, faster than llava:13b)
          ollama pull minicpm-v:8b

          # Verify Ollama is running
          curl -s http://localhost:11434/api/tags || echo "Warning: Ollama not responding"

      - name: Run CSV Tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISPLAY: :99
          TZ: ${{ inputs.timezone }}
        run: |
          # Start Xvfb virtual display
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          # Configure tint2 panel to show clock in top-right corner
          mkdir -p ~/.config/tint2
          cat > ~/.config/tint2/tint2rc << 'EOF'
          # Tint2 config for CSV test evidence - shows system date/time
          panel_position = top right horizontal
          panel_size = 100% 32
          panel_background_id = 1

          background_color = #000000 80
          border_color = #ffffff 20

          # Clock showing date and time in DD/MM/YYYY HH:MM format
          time1_format = %d/%m/%Y %H:%M
          time1_font = Ubuntu Bold 12
          clock_font_color = #ffffff 100
          clock_padding = 8 4
          clock_background_id = 1
          EOF

          # Start window manager and panel
          fluxbox &
          sleep 1
          tint2 &
          sleep 1

          # Run tests with browser visible on Xvfb (desktop screenshots will capture window + panel with clock)
          # Uses hybrid LLM mode (local Ollama + Claude fallback) by default

          # Check if csvtool is installed
          which csvtool
          csvtool --version || echo "csvtool version check failed"

          # Verify working directory and scenario file
          pwd
          ls -la scenarios/

          # Capture exit code but don't fail workflow on test failures
          set +e
          if [ "${{ inputs.use_local_llm }}" = "true" ]; then
            echo "🚀 Running with HYBRID mode (Local LLM + Claude fallback)"
            csvtool run \
              --url "${{ inputs.application_url }}" \
              --workbook "${{ inputs.workbook }}" \
              --output output \
              --no-headless \
              --ollama-model minicpm-v:8b 2>&1 | tee csvtool-output.log
          else
            echo "☁️ Running with CLAUDE ONLY mode"
            csvtool run \
              --url "${{ inputs.application_url }}" \
              --workbook "${{ inputs.workbook }}" \
              --output output \
              --no-headless \
              --claude-only 2>&1 | tee csvtool-output.log
          fi
          EXIT_CODE=$?
          set -e

          echo "csvtool exit code: $EXIT_CODE"

          # Analyze results and set appropriate workflow status
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ All tests passed successfully"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "⚠️ Some tests failed - see evidence document for details"
            echo "::warning::Test execution completed but some tests failed. Check evidence document."
            # Don't fail the workflow for test failures
            exit 0
          else
            echo "❌ Critical error occurred (code issue or connection problem)"
            echo "::error::Critical error during execution (exit code: $EXIT_CODE)"
            exit $EXIT_CODE
          fi

      - name: Check Output Files
        if: always()
        run: |
          echo "Checking for output files..."
          ls -la
          if [ -d "output" ]; then
            echo "✅ Output directory exists"
            ls -la output/
            if [ -d "output/screenshots" ]; then
              echo "✅ Screenshots directory exists"
              ls -la output/screenshots/ | head -20
            else
              echo "❌ Screenshots directory not found"
            fi
            if ls output/*.docx 1> /dev/null 2>&1; then
              echo "✅ Evidence documents found:"
              ls -lh output/*.docx
            else
              echo "❌ No evidence documents found"
            fi
          else
            echo "❌ Output directory not found"
          fi

      - name: Upload Evidence
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: csv-evidence-${{ github.run_number }}
          path: output/*.docx
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: csv-screenshots-${{ github.run_number }}
          path: output/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Execution Log
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: csvtool-log-${{ github.run_number }}
          path: csvtool-output.log
          retention-days: 7
          if-no-files-found: warn
